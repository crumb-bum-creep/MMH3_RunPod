name: Test startup optimization branch

on:
  push:
    branches: [startup-runtime-fastpath, phone-ui-library-ux]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pytest PyYAML requests psutil huggingface_hub aiohttp Pillow
      - run: PYTHONPATH=runtime pytest -q
      - run: python -m py_compile services/phone-ui/server.py runtime/mmh3/*.py
      - run: node --check services/phone-ui/static/app.js
      - run: bash -n scripts/mmh3 scripts/first_boot_check.sh runtime/entrypoint.sh
