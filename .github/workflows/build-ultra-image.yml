name: Build ultra-startup image

on:
  push:
    branches: [startup-optimization]
    paths:
      - Dockerfile.ultra
      - runtime/**
      - config/**
      - workflows/**
      - services/**
      - scripts/**
      - tests/**
      - .github/workflows/build-ultra-image.yml
  workflow_dispatch:

concurrency:
  group: mmh3-ultra-image
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build-ultra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reclaim runner disk
        shell: bash
        run: |
          sudo swapoff -a || true
          sudo rm -f /swapfile || true
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache || true
          sudo apt-get clean || true
          docker system prune -af --volumes || true
          df -h /

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image refs
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/mmh3-runpod"
          OLD="$IMAGE:sha-7200522bcf6e"
          FAST="$IMAGE:fast-8237bab6e0f2"
          ULTRA="$IMAGE:ultra-${GITHUB_SHA::12}"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          echo "OLD=$OLD" >> "$GITHUB_ENV"
          echo "FAST=$FAST" >> "$GITHUB_ENV"
          echo "ULTRA=$ULTRA" >> "$GITHUB_ENV"

      - name: Build ultra image
        shell: bash
        run: |
          set -o pipefail
          docker build --progress=plain -f Dockerfile.ultra -t "$ULTRA" . 2>&1 | tee ultra-build.log

      - name: Smoke test ultra image
        shell: bash
        run: |
          docker run --rm --entrypoint bash "$ULTRA" -lc '
            set -Eeuo pipefail
            export PYTHONPATH=/opt/mmh3/runtime
            python -c "import torch,yaml,requests,aiohttp,huggingface_hub; print(torch.__version__,torch.version.cuda); assert torch.__version__.startswith(\"2.11.0\"); assert torch.version.cuda == \"13.0\""
            python -c "import onnxruntime as o; p=o.get_available_providers(); assert \"CUDAExecutionProvider\" in p, p; print(p)"
            python -c "import triton; print(\"triton\",triton.__version__)"
            python -c "import sageattention; print(\"sageattention import OK\")"
            python /ComfyUI/main.py --cpu --quick-test-for-ci --disable-auto-launch
            python /opt/mmh3/services/phone-ui/server.py --help >/dev/null
            jupyter-lab --version
            ffmpeg -version | head -1
            echo "=== unresolved libtorch_cuda dependencies ==="
            TORCHLIB=$(python -c "import torch,os; print(os.path.join(os.path.dirname(torch.__file__),\"lib\",\"libtorch_cuda.so\"))")
            ldd "$TORCHLIB" | grep "not found" && exit 1 || true
          '

      - name: Local image inventory
        shell: bash
        run: |
          docker image inspect "$ULTRA" --format='uncompressed_bytes={{.Size}}'
          echo "history_entries=$(docker history -q "$ULTRA" | wc -l)"
          echo "nonempty_history_entries=$(docker history --format '{{.Size}}' "$ULTRA" | grep -vc '^0B$' || true)"
          docker history --format 'table {{.Size}}\t{{.CreatedBy}}' "$ULTRA" | head -90

      - name: Push ultra candidate
        run: docker push "$ULTRA"

      - name: Compare registry manifests
        shell: bash
        run: |
          python - "$OLD" "$FAST" "$ULTRA" <<'PY'
          import json,subprocess,sys
          def manifest(ref):
              return json.loads(subprocess.check_output(["docker","manifest","inspect",ref],text=True))
          def stats(ref):
              d=manifest(ref)
              layers=d.get("layers") or []
              return {
                  "ref":ref,
                  "layers":len(layers),
                  "compressed_bytes":sum(int(x.get("size") or 0) for x in layers),
                  "largest_layers":sorted((int(x.get("size") or 0) for x in layers),reverse=True)[:10],
              }
          rows=[stats(x) for x in sys.argv[1:]]
          for r in rows: print(json.dumps(r,indent=2))
          base=rows[0]["compressed_bytes"]
          with open("/tmp/ultra-stats.md","w") as f:
              f.write("### Startup image comparison\n\n")
              f.write("| Image | Registry layers | Compressed size | Reduction vs old |\n|---|---:|---:|---:|\n")
              for r in rows:
                  red=(1-r["compressed_bytes"]/base) if base else 0
                  f.write(f"| `{r['ref']}` | {r['layers']} | {r['compressed_bytes']/1e9:.2f} GB | {red:.1%} |\n")
              f.write("\nLargest compressed layers:\n\n")
              for r in rows:
                  f.write(f"- `{r['ref']}`: "+", ".join(f"{x/1e9:.2f} GB" for x in r["largest_layers"][:6])+"\n")
          PY
          cat /tmp/ultra-stats.md >> "$GITHUB_STEP_SUMMARY"

      - name: Save diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ultra-startup-diagnostics-${{ github.run_id }}
          path: |
            ultra-build.log
            /tmp/ultra-stats.md
          if-no-files-found: ignore
          retention-days: 7
