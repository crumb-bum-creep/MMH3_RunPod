name: Build MMH3 image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - runtime/**
      - config/**
      - workflows/**
      - services/**
      - scripts/**
      - .github/workflows/build-image.yml

concurrency:
  group: mmh3-image-main
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reclaim runner disk for CUDA image
        shell: bash
        run: |
          echo "=== disk before cleanup ==="
          df -h /
          sudo swapoff -a || true
          sudo rm -f /swapfile || true
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/.ghcup || true
          sudo rm -rf /opt/hostedtoolcache || true
          sudo apt-get clean || true
          docker system prune -af --volumes || true
          echo "=== disk after cleanup ==="
          df -h /

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image with plain log
        id: docker_build
        shell: bash
        run: |
          set -o pipefail
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/mmh3-runpod"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          docker build --progress=plain -t "$IMAGE:latest" -t "$IMAGE:sha-${GITHUB_SHA::12}" . 2>&1 | tee docker-build.log

      - name: Publish failed build tail
        if: failure() && steps.docker_build.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "### Build failure · run ${GITHUB_RUN_ID}"
            echo
            echo '~~~text'
            tail -n 180 docker-build.log
            echo '~~~'
          } > /tmp/build-comment.md
          gh issue comment 1 --repo "$GITHUB_REPOSITORY" --body-file /tmp/build-comment.md

      - name: Smoke test built image
        if: steps.docker_build.outcome == 'success'
        shell: bash
        run: |
          docker run --rm --entrypoint bash "$IMAGE:sha-${GITHUB_SHA::12}" -lc '
            set -Eeuo pipefail
            export PATH=/opt/venv/bin:$PATH
            export PYTHONPATH=/opt/mmh3/runtime
            test -f /ComfyUI/main.py
            test -x /opt/mmh3/runtime/entrypoint.sh
            test -f /opt/mmh3/services/phone-ui/server.py
            test "$(find /opt/mmh3/workflows/api -maxdepth 1 -name "*.json" | wc -l)" -eq 6
            ACTUAL="$(git -C /ComfyUI rev-parse HEAD)"
            test "$ACTUAL" = "c2bcbecd82ec5ae66594340b395c24ef0217b238"
            python - <<"PY"
import torch, yaml, requests, aiohttp, huggingface_hub
from mmh3.hardware import detect
from mmh3.common import IMAGE_ROOT
assert torch.__version__.startswith("2.11.0"), torch.__version__
assert torch.version.cuda == "13.0", torch.version.cuda
assert str(IMAGE_ROOT) == "/opt/mmh3"
print("torch", torch.__version__, "cuda", torch.version.cuda)
print("runtime imports OK")
PY
            python /opt/mmh3/services/phone-ui/server.py --help >/dev/null
          '

      - name: Save build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-build-log-${{ github.run_id }}
          path: docker-build.log
          if-no-files-found: warn
          retention-days: 7

      - name: Push image
        if: steps.docker_build.outcome == 'success'
        run: |
          docker push "$IMAGE:latest"
          docker push "$IMAGE:sha-${GITHUB_SHA::12}"

      - name: Image summary
        if: steps.docker_build.outcome == 'success'
        run: |
          echo "### MMH3 image" >> "$GITHUB_STEP_SUMMARY"
          echo "`$IMAGE:sha-${GITHUB_SHA::12}`" >> "$GITHUB_STEP_SUMMARY"
          docker image inspect "$IMAGE:sha-${GITHUB_SHA::12}" --format='Size: {{.Size}} bytes' >> "$GITHUB_STEP_SUMMARY"
