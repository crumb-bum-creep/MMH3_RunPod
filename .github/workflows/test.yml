name: Test runtime
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - runtime/**
      - tests/**
      - config/**
      - .github/workflows/test.yml
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pytest PyYAML requests psutil huggingface_hub
      - run: PYTHONPATH=runtime pytest -q
