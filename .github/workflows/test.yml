name: Test runtime
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - runtime/**
      - services/**
      - workflows/**
      - tests/**
      - config/**
      - .github/workflows/test.yml
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pytest PyYAML requests psutil huggingface_hub aiohttp Pillow
      - run: PYTHONPATH=runtime pytest -q
      - run: python -m py_compile services/phone-ui/server.py services/phone-ui/server_v2.py services/phone-ui/output_indexer.py runtime/mmh3/*.py
      - run: node --check services/phone-ui/static/app.js
      - run: node --check services/phone-ui/static/library-v2.js
      - run: node --check services/phone-ui/static/features-v3.js
      - run: |
          python - <<'PY'
          import json, pathlib
          files=list(pathlib.Path("workflows/api").glob("*.json"))
          assert len(files) == 6, f"expected 6 workflows, found {len(files)}"
          for p in files:
              d=json.loads(p.read_text())
              assert isinstance(d, dict) and d, p
              nodes=list(d.values())
              turbo=[n for n in nodes if n.get("class_type")=="LoraLoaderModelOnly"]
              shift=[n for n in nodes if n.get("class_type")=="MiniMaxH3SigmaShift"]
              sched=[n for n in nodes if n.get("class_type")=="BasicScheduler"]
              sampler=[n for n in nodes if n.get("class_type")=="KSamplerSelect"]
              assert len(turbo)==1, (p, "turbo")
              assert len(shift)==1, (p, "shift")
              assert len(sched)==1, (p, "scheduler")
              assert len(sampler)==1, (p, "sampler")
              assert not any(n.get("class_type") in {"BetaSamplingScheduler","ExtendIntermediateSigmas"} for n in nodes), p
              is_r2v=p.name.startswith("r2v_")
              expected=("minimax_h3_ref2v_turbo_8step_v1.0_768p_comfyui_bf16.safetensors"
                        if is_r2v else
                        "minimax_h3_fl2v_turbo_8step_v1.0_768p_comfyui_bf16.safetensors")
              assert turbo[0]["inputs"]["lora_name"]==expected, p
              assert float(turbo[0]["inputs"]["strength_model"])==1.0, p
              assert float(shift[0]["inputs"]["shift_video"])==(12.0 if is_r2v else 6.0), p
              assert float(shift[0]["inputs"]["shift_audio"])==3.0, p
              assert sched[0]["inputs"]["scheduler"]=="simple" and int(sched[0]["inputs"]["steps"])==8, p
              assert sampler[0]["inputs"]["sampler_name"]=="euler", p
              if p.name=="r2v_custom.json":
                  assert not any(n.get("class_type")=="OpenRouterNode" for n in nodes), p
          print("validated", len(files), "Balanced-default workflow JSON files")
          PY
