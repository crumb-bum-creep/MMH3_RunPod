name: Test runtime
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - runtime/**
      - services/**
      - workflows/**
      - tests/**
      - config/**
      - .github/workflows/test.yml
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pytest PyYAML requests psutil huggingface_hub
      - run: PYTHONPATH=runtime pytest -q
      - run: python -m py_compile services/phone-ui/server.py runtime/mmh3/*.py
      - run: |
          python - <<'PY'
          import json, pathlib
          files=list(pathlib.Path("workflows/api").glob("*.json"))
          assert len(files) == 6, f"expected 6 workflows, found {len(files)}"
          for p in files:
              d=json.loads(p.read_text())
              assert isinstance(d, dict) and d, p
          print("validated", len(files), "workflow JSON files")
          PY
