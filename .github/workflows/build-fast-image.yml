name: Build startup-optimized image

on:
  push:
    branches: [startup-optimization]
    paths:
      - Dockerfile.fast
      - runtime/**
      - config/**
      - workflows/**
      - services/**
      - scripts/**
      - tests/**
      - .github/workflows/build-fast-image.yml
  workflow_dispatch:

concurrency:
  group: mmh3-fast-image
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build-fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reclaim runner disk
        shell: bash
        run: |
          sudo swapoff -a || true
          sudo rm -f /swapfile || true
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache || true
          sudo apt-get clean || true
          docker system prune -af --volumes || true
          df -h /

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull validated baseline
        run: |
          PROD=ghcr.io/crumb-bum-creep/mmh3-runpod:sha-7200522bcf6e
          docker pull "$PROD"
          echo "PROD=$PROD" >> "$GITHUB_ENV"

      - name: Baseline inventory
        shell: bash
        run: |
          echo "=== BASELINE IMAGE ==="
          docker image inspect "$PROD" --format='uncompressed_bytes={{.Size}}'
          echo "history_entries=$(docker history -q "$PROD" | wc -l)"
          echo "nonempty_history_entries=$(docker history --format '{{.Size}}' "$PROD" | grep -vc '^0B$' || true)"
          docker run --rm --entrypoint bash "$PROD" -lc '
            echo "python=$(readlink -f /opt/venv/bin/python || true)"
            cat /opt/venv/pyvenv.cfg || true
            du -sh /opt/venv /ComfyUI /opt/mmh3 2>/dev/null || true
          '

      - name: Build fast image
        shell: bash
        run: |
          set -o pipefail
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/mmh3-runpod"
          FAST="$IMAGE:fast-${GITHUB_SHA::12}"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          echo "FAST=$FAST" >> "$GITHUB_ENV"
          docker build --progress=plain -f Dockerfile.fast -t "$FAST" . 2>&1 | tee fast-build.log

      - name: Smoke test fast image
        shell: bash
        run: |
          docker run --rm --entrypoint bash "$FAST" -lc '
            set -Eeuo pipefail
            export PYTHONPATH=/opt/mmh3/runtime
            python -c "import torch,yaml,requests,aiohttp,huggingface_hub; print(torch.__version__, torch.version.cuda); assert torch.__version__.startswith(\"2.11.0\"); assert torch.version.cuda == \"13.0\""
            python -c "import onnxruntime as o; p=o.get_available_providers(); assert \"CUDAExecutionProvider\" in p, p; print(p)"
            python /ComfyUI/main.py --cpu --quick-test-for-ci --disable-auto-launch
            python /opt/mmh3/services/phone-ui/server.py --help >/dev/null
            jupyter-lab --version
            ffmpeg -version | head -1
          '

      - name: Local image inventory
        shell: bash
        run: |
          echo "=== FAST IMAGE ==="
          docker image inspect "$FAST" --format='uncompressed_bytes={{.Size}}'
          echo "history_entries=$(docker history -q "$FAST" | wc -l)"
          echo "nonempty_history_entries=$(docker history --format '{{.Size}}' "$FAST" | grep -vc '^0B$' || true)"
          docker history --format 'table {{.Size}}\t{{.CreatedBy}}' "$FAST" | head -80

      - name: Push fast candidate
        run: docker push "$FAST"

      - name: Compare registry manifests
        shell: bash
        run: |
          python - "$PROD" "$FAST" <<'PY'
          import json,subprocess,sys
          def manifest(ref):
              raw=subprocess.check_output(["docker","manifest","inspect",ref],text=True)
              return json.loads(raw)
          def stats(ref):
              d=manifest(ref)
              layers=d.get("layers") or []
              return {
                  "ref":ref,
                  "layers":len(layers),
                  "compressed_bytes":sum(int(x.get("size") or 0) for x in layers),
                  "largest_layers":sorted((int(x.get("size") or 0) for x in layers), reverse=True)[:8],
              }
          rows=[stats(x) for x in sys.argv[1:]]
          for r in rows:
              print(json.dumps(r,indent=2))
          if all(r["compressed_bytes"] for r in rows):
              old,new=rows
              reduction=1-new["compressed_bytes"]/old["compressed_bytes"]
              print(f"compressed reduction: {reduction:.1%}")
          with open("/tmp/image-stats.md","w") as f:
              f.write("### Startup image comparison\n\n")
              f.write("| Image | Registry layers | Compressed size |\n|---|---:|---:|\n")
              for r in rows:
                  f.write(f"| `{r['ref']}` | {r['layers']} | {r['compressed_bytes']/1e9:.2f} GB |\n")
              if all(r["compressed_bytes"] for r in rows):
                  f.write(f"\nCompressed-size reduction: **{reduction:.1%}**\n")
          PY
          cat /tmp/image-stats.md >> "$GITHUB_STEP_SUMMARY"

      - name: Save build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: startup-image-diagnostics-${{ github.run_id }}
          path: |
            fast-build.log
            /tmp/image-stats.md
          if-no-files-found: ignore
          retention-days: 7
