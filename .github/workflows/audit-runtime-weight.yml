name: Audit Python runtime weight

on:
  push:
    branches: [startup-runtime-fastpath]
    paths:
      - Dockerfile.ultra
      - .github/workflows/audit-runtime-weight.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reclaim disk
        run: |
          sudo swapoff -a || true
          sudo rm -f /swapfile || true
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache || true
          docker system prune -af --volumes || true

      - name: Build dependency stage
        run: docker build --progress=plain -f Dockerfile.ultra --target builder -t mmh3-dependency-audit .

      - name: Audit installed runtime
        shell: bash
        run: |
          docker run --rm --entrypoint bash mmh3-dependency-audit -lc '
            set -Eeuo pipefail
            echo "=== roots ==="
            du -sh /opt/venv /ComfyUI
            echo
            echo "=== largest site-packages entries ==="
            du -sx /opt/venv/lib/python3.12/site-packages/* 2>/dev/null | sort -nr | head -60 | awk "{printf \"%.1f MiB\\t%s\\n\", \\$1/1024, \\$2}"
            echo
            echo "=== nvidia package directories ==="
            du -sx /opt/venv/lib/python3.12/site-packages/nvidia/* 2>/dev/null | sort -nr | awk "{printf \"%.1f MiB\\t%s\\n\", \\$1/1024, \\$2}" || true
            echo
            echo "=== pip freeze ==="
            /opt/venv/bin/pip freeze
          ' | tee runtime-weight.txt

      - uses: actions/upload-artifact@v4
        with:
          name: runtime-weight-${{ github.run_id }}
          path: runtime-weight.txt
          retention-days: 7
