<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#121821">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>MMH3 Studio</title>
<link rel="preload" href="/static/fonts/archivo-latin-wdth-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/static/app.css?v={{v}}">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23121821'/%3E%3Ccircle cx='16' cy='16' r='7' fill='%23E5484D'/%3E%3C/svg%3E">
</head>
<body>
<header class="top">
  <a class="brand" href="#create" aria-label="MMH3 Studio">MMH3 <span>Studio</span></a>
  <button class="tally" id="tally" hidden aria-label="Open the queue">
    <img id="tallyImg" alt="">
    <span class="tally-dot" aria-hidden="true"></span>
    <span class="tally-text" id="tallyText"></span>
  </button>
  <span class="conn" id="conn" title="ComfyUI connection"></span>
</header>

<main id="view"></main>

<nav class="tabs" id="tabs" aria-label="Sections">
  <a href="#create" data-tab="create"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span>Create</span></a>
  <a href="#queue" data-tab="queue"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg><span>Queue</span><b class="badge" id="queueBadge" hidden></b></a>
  <a href="#library" data-tab="library"><svg viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="7" height="11" rx="1.5"/><rect x="13.5" y="3.5" width="7" height="11" rx="1.5"/><path d="M4 19h16"/></svg><span>Library</span></a>
  <a href="#refs" data-tab="refs"><svg viewBox="0 0 24 24"><circle cx="9" cy="9" r="4"/><path d="M3.5 20c.8-3.2 3-5 5.5-5s4.7 1.8 5.5 5M15 5.5h6M15 9.5h6M17 13.5h4"/></svg><span>References</span></a>
  <a href="#more" data-tab="more"><svg viewBox="0 0 24 24"><circle cx="6" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="18" cy="12" r="1.3"/></svg><span>More</span></a>
</nav>

<div class="sheet-scrim" id="scrim" hidden></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" hidden>
  <div class="sheet-grip" aria-hidden="true"></div>
  <div class="sheet-head"><h2 id="sheetTitle"></h2><button class="icon-btn" id="sheetClose" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <div class="sheet-body" id="sheetBody"></div>
</section>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<input type="file" id="filePick" hidden multiple>
<script src="/static/app.js?v={{v}}"></script>
</body>
</html>
