# Model manifest. Paths are relative to the persistent models folder
# (/workspace/ComfyUI/models). Files that already exist at a large-enough size
# are never re-downloaded, so an existing MMH3 volume is picked up as-is.
#
# group:
#   core  - downloaded automatically on every boot until present
#   eros  - optional base checkpoint; downloaded when enabled in System or with
#           MMH3_DOWNLOAD_EROS=true
# used_by: which generation families need the file (fl2v = T2V/I2V, ref2v = R2V)
# role: turbo marks a turbo LoRA. A family only waits for the turbo LoRA its
#       recipe uses, so a new one downloading never blocks the others.

models:
  video_vae:
    file: vae/minimax_h3_video_vae_fp16.safetensors
    hf: Comfy-Org/MiniMax-H3
    path: vae/minimax_h3_video_vae_fp16.safetensors
    group: core
    used_by: [fl2v, ref2v]
    min_mb: 100

  audio_vae:
    file: vae/minimax_h3_audio_vae_fp32.safetensors
    hf: Comfy-Org/MiniMax-H3
    path: vae/minimax_h3_audio_vae_fp32.safetensors
    group: core
    used_by: [fl2v, ref2v]
    min_mb: 100

  text_encoder:
    file: text_encoders/qwen3vl_32b_minimax_h3_int8_convrot.safetensors
    hf: Comfy-Org/MiniMax-H3
    path: text_encoders/qwen3vl_32b_minimax_h3_int8_convrot.safetensors
    group: core
    used_by: [fl2v, ref2v]
    min_mb: 1000

  fl2va_int8:
    file: diffusion_models/minimax_h3_fl2va_pruned_int8_convrot.safetensors
    hf: Comfy-Org/MiniMax-H3
    path: diffusion_models/minimax_h3_fl2va_pruned_int8_convrot.safetensors
    group: core
    used_by: [fl2v]
    min_mb: 1000

  ref2va_int8:
    file: diffusion_models/minimax_h3_ref2va_pruned_int8_convrot.safetensors
    hf: Comfy-Org/MiniMax-H3
    path: diffusion_models/minimax_h3_ref2va_pruned_int8_convrot.safetensors
    group: core
    used_by: [ref2v]
    min_mb: 1000

  taeh3:
    file: vae_approx/taeh3.safetensors
    hf: Hearmeman/comfyui-template-assets
    path: vae_approx/taeh3.safetensors
    group: core
    used_by: []          # live previews only; generation works without it
    min_mb: 5

  fl2v_turbo_8step:
    file: loras/minimax_h3_fl2v_turbo_8step_v1.0_768p_comfyui_bf16.safetensors
    hf: lightx2v/Minimax-h3-Turbo
    path: minimax_h3_fl2v_turbo_8step_v1.0_768p_comfyui_bf16.safetensors
    group: core
    used_by: [fl2v]
    role: turbo
    label: FL2V turbo 8-step v1.0 768p
    min_mb: 500

  fl2v_turbo_4step:
    file: loras/minimax_h3_fl2v_turbo_4step_v1.2_768p_comfyui_bf16.safetensors
    hf: lightx2v/Minimax-h3-Turbo
    path: minimax_h3_fl2v_turbo_4step_v1.2_768p_comfyui_bf16.safetensors
    group: core
    used_by: [fl2v]
    role: turbo
    label: FL2V turbo 4-step v1.2 768p
    min_mb: 500

  ref2v_turbo_8step:
    file: loras/minimax_h3_ref2v_turbo_8step_v1.0_768p_comfyui_bf16.safetensors
    hf: lightx2v/Minimax-h3-Turbo
    path: minimax_h3_ref2v_turbo_8step_v1.0_768p_comfyui_bf16.safetensors
    group: core
    used_by: [ref2v]
    role: turbo
    label: Ref2V turbo 8-step v1.0 768p
    min_mb: 500

  ref2v_turbo_4step_v01:
    file: loras/minimax_h3_ref2v_turbo_4step_v0.1_comfyui_bf16.safetensors
    hf: lightx2v/Minimax-h3-Turbo
    path: minimax_h3_ref2v_turbo_4step_v0.1_comfyui_bf16.safetensors
    group: core
    used_by: [ref2v]
    role: turbo
    label: Ref2V turbo 4-step v0.1
    min_mb: 1000

  h3_image_vae:
    # Experimental single-image H3 VAE (Mamad8), for the Image editing v2 workflow.
    # Images only: never a replacement for the video VAE.
    file: vae/minimax_h3_t1_image_vae_step1597.safetensors
    hf: Mamad8/MiniMax-H3-Image-VAE
    path: minimax_h3_t1_image_vae_step1597.safetensors
    group: core
    used_by: []
    min_mb: 4900

  eros_beta5_int8:
    file: diffusion_models/10Eros_Max_h3_hybrid_beta5_int8.safetensors
    hf: TenStrip/10Eros-Max
    path: 10Eros_Max_h3_hybrid_beta5_int8.safetensors
    group: eros
    used_by: []
    min_mb: 1000

# Base checkpoints selectable per generation. "stock" picks the family's own
# diffusion model; any other entry replaces it for every family it lists.
checkpoints:
  stock:
    label: Stock H3 (INT8 ConvRot)
    files:
      fl2v: fl2va_int8
      ref2v: ref2va_int8
  eros:
    label: Eros Max beta5 (INT8)
    files:
      fl2v: eros_beta5_int8
      ref2v: eros_beta5_int8
