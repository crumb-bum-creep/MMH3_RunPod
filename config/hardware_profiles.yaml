profiles:
  rtx_5090:
    match:
      gpu_name_contains: ["RTX 5090"]
      min_vram_gb: 28
      max_vram_gb: 40
    comfy:
      reserve_vram_gb: 2
    memory:
      cleanup_fraction: 0.82
      resume_fraction: 0.74
      critical_fraction: 0.90
      min_free_headroom_gb: 44
      resume_free_headroom_gb: 50
      interrupt_running_on_critical: true

  rtx_pro_6000_blackwell:
    match:
      gpu_name_contains: ["RTX PRO 6000", "RTX 6000"]
      min_vram_gb: 80
    comfy:
      # The captured known-good 96 GB pod did not use --reserve-vram.
      reserve_vram_gb: 0
    memory:
      cleanup_fraction: 0.86
      resume_fraction: 0.78
      critical_fraction: 0.93
      min_free_headroom_gb: 32
      resume_free_headroom_gb: 38
      interrupt_running_on_critical: false

  fallback:
    comfy:
      reserve_vram_gb: 2
    memory:
      cleanup_fraction: 0.82
      resume_fraction: 0.74
      critical_fraction: 0.90
      min_free_headroom_gb: 40
      resume_free_headroom_gb: 46
      interrupt_running_on_critical: true
